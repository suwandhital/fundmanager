<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#022c22" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- High-Visibility Vibrant Emerald Squircle Background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="2.5"/>

  <!-- Crisp White Foreground Finance Card -->
  <rect x="22" y="34" width="84" height="60" rx="8" fill="#ffffff" filter="url(#shadow)"/>

  <!-- High-Contrast Slate Magnetic Band -->
  <rect x="22" y="47" width="84" height="12" fill="#0f172a"/>

  <!-- Emerald Smart Chip -->
  <rect x="32" y="67" width="18" height="14" rx="3" fill="#10b981"/>

  <!-- Upward Financial Growth Indicator -->
  <circle cx="86" cy="74" r="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2.2"/>
  <path d="M82 76 L86 71 L90 76 M86 71 L86 80" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
