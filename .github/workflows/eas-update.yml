name: Over-The-Air Update

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'app.json'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Update Channel (preview or production)'
        required: true
        default: 'preview'
      message:
        description: 'Update commit message or release notes'
        required: false
        default: 'Automated OTA update from GitHub'

jobs:
  publish-update:
    name: Publish Over-The-Air Update
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: 3. Install Dependencies
        run: npm ci

      - name: 4. Check for EXPO_TOKEN
        id: token-check
        run: |
          if [ -n "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "✅ EXPO_TOKEN found in GitHub secrets."
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice ::EXPO_TOKEN not yet added to GitHub Secrets. To publish updates automatically to your phone on git push, generate an access token at https://expo.dev/settings/access-tokens and add it to GitHub Secrets as EXPO_TOKEN."
          fi

      - name: 5. Publish Over-The-Air (OTA) Update
        if: steps.token-check.outputs.has_token == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'preview' }}"
          MSG="${{ github.event.inputs.message || github.event.head_commit.message || 'Automated OTA update' }}"
          echo "Publishing OTA update to channel: $CHANNEL with message: $MSG"
          npx --yes eas-cli update --channel "$CHANNEL" --message "$MSG" --non-interactive
