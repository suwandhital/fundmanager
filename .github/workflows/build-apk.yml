name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      azure_api_url:
        description: 'Azure App Service URL'
        required: true
        default: 'https://fundmanager-api-aphxbabxdvd2g5a0.uaenorth-01.azurewebsites.net'

jobs:
  build-apk:
    name: Build Standalone APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: 3. Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 5. Install Client Dependencies
        run: npm ci

      - name: 6. Prebuild Android Native Project
        env:
          EXPO_PUBLIC_API_URL: ${{ github.event.inputs.azure_api_url }}
        run: |
          npx expo prebuild --platform android --no-install

      - name: 7. Compile Release APK
        working-directory: android
        env:
          EXPO_PUBLIC_API_URL: ${{ github.event.inputs.azure_api_url }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 8. Prepare APK Output
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/*.apk apk-output/FundManager.apk
          ls -lh apk-output/

      - name: 9. Upload APK to GitHub Artifacts (Downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: FundManager-APK
          path: apk-output/FundManager.apk
          retention-days: 30

      - name: 10. Publish to GitHub Releases (Direct Download Link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "FundManager Android APK v1.0.0"
          body: "Official standalone release for Suwan's FundManager Android app."
          files: apk-output/FundManager.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
