name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      azure_api_url:
        description: 'Azure App Service URL'
        required: false
        default: 'https://fundmanager-api-aphxbabxdvd2g5a0.uaenorth-01.azurewebsites.net'
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build Standalone APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: 3. Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 5. Install Client Dependencies
        run: npm ci

      - name: 6. Prebuild Android Native Project
        env:
          EXPO_PUBLIC_API_URL: ${{ github.event.inputs.azure_api_url || 'https://fundmanager-api-aphxbabxdvd2g5a0.uaenorth-01.azurewebsites.net' }}
        run: |
          npx expo prebuild --platform android --no-install

      - name: 7. Compile Release APK
        working-directory: android
        env:
          EXPO_PUBLIC_API_URL: ${{ github.event.inputs.azure_api_url || 'https://fundmanager-api-aphxbabxdvd2g5a0.uaenorth-01.azurewebsites.net' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 8. Prepare APK Output
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/*.apk apk-output/FundManager.apk
          ls -lh apk-output/

      - name: 9. Upload APK to GitHub Artifacts (Downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: FundManager-APK
          path: apk-output/FundManager.apk
          retention-days: 30

      - name: 10. Publish to GitHub Releases (Direct Download Link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "FundManager Android APK ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}"
          body: |
            ### 📱 FundManager Android Release

            Official standalone APK release for Suwan's FundManager application.

            - **Over-The-Air Updates**: Built-in self-hosted OTA updates connected to Azure App Service
            - **Cloud Backend**: [https://fundmanager-api-aphxbabxdvd2g5a0.uaenorth-01.azurewebsites.net](https://fundmanager-api-aphxbabxdvd2g5a0.uaenorth-01.azurewebsites.net)
            - **Direct APK**: Download `FundManager.apk` below and install directly on any Android device.
          files: apk-output/FundManager.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
