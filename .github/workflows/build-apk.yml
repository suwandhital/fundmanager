name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      azure_api_url:
        description: 'Azure App Service URL (e.g., https://your-app.azurewebsites.net)'
        required: true
        default: 'https://fundmanager-api.azurewebsites.net'

jobs:
  build-apk:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: 3. Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 4. Install Client Dependencies
        run: npm ci

      - name: 5. Trigger EAS Cloud Build (Generates Direct Download APK)
        env:
          EXPO_PUBLIC_API_URL: ${{ github.event.inputs.azure_api_url }}
        run: |
          eas build --platform android --profile preview --non-interactive

